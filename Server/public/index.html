<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTNS | Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-animated min-h-screen relative overflow-hidden flex items-center">
    <div class="absolute top-[5%] left-[-5%] w-[600px] h-[600px] bg-sky-600/20 rounded-full blur-[150px] float-anim pointer-events-none z-0"></div>
    <div class="absolute bottom-[-10%] right-[-5%] w-[600px] h-[600px] bg-indigo-600/20 rounded-full blur-[150px] float-anim pointer-events-none z-0" style="animation-delay: -3s"></div>
    <div class="container mx-auto px-6 lg:px-12 relative z-10 flex flex-col lg:flex-row items-center gap-12 lg:gap-20">
        <div class="flex-1 text-center lg:text-left mt-10 lg:mt-0">
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-sky-500/10 border border-sky-500/20 text-sky-400 font-black text-[10px] tracking-widest uppercase mb-8 shadow-inner">
                <span class="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span>
                Enterprise Edition
            </div>
            <h1 class="text-5xl lg:text-6xl font-black text-white tracking-tighter mb-6 leading-[1.1] drop-shadow-2xl">
                CTNS <span class="text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-emerald-400">KIOSK</span>
            </h1>
            <p class="text-slate-400 text-sm leading-relaxed mb-10 max-w-lg mx-auto lg:mx-0 font-medium tracking-wide">
                Hệ thống giám sát và cách ly môi trường thi đấu lập trình chuyên nghiệp. Tích hợp đồng bộ thời gian thực, khóa phần mềm bên thứ ba và bảo mật tuyệt đối cho kỳ thi VNOI.
            </p>
            <div class="flex flex-col sm:flex-row items-center justify-center lg:justify-start gap-5">
                <a href="support" class="px-8 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white font-black text-[11px] tracking-widest uppercase hover:bg-white/10 transition-all flex items-center gap-3 shadow-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Tải Kiosk Client
                </a>
            </div>
        </div>
        <div class="w-full max-w-md">
            <div class="glass-panel w-full rounded-[2rem] p-10 shadow-2xl border-t border-sky-500/30">
                <div class="flex gap-2 mb-8 border-b border-[#1e293b] pb-2">
                    <button id="tab-login" onclick="switchAuth('login')" class="flex-1 text-white font-black text-[10px] tracking-widest px-2 py-2 border-b-2 border-sky-400 uppercase transition-all">Đăng nhập</button>
                    <button id="tab-register" onclick="switchAuth('register')" class="flex-1 text-slate-500 font-bold text-[10px] tracking-widest px-2 py-2 hover:text-white uppercase transition-colors">Kích hoạt</button>
                </div>
                <form id="login-form" onsubmit="handleLogin(event)" class="view-section space-y-5">
                    <input type="text" id="l-user" required class="input-field py-4" placeholder="Tên đăng nhập">
                    <input type="password" id="l-pass" required class="input-field tracking-widest py-4" placeholder="Mật khẩu">
                    <button type="submit" id="btn-login" class="btn-primary w-full h-[55px] text-[11px] mt-2 rounded-xl">VÀO HỆ THỐNG</button>
                </form>
                <form id="register-form" onsubmit="handleRegister(event)" class="view-section space-y-4 hidden">
                    <input type="text" id="r-key" required class="input-field text-emerald-400 font-mono text-center uppercase border-emerald-500/30 py-4" placeholder="LICENSE KEY">
                    <input type="text" id="r-user" required class="input-field py-3.5" placeholder="Tên đăng nhập">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="email" id="r-email" required class="input-field py-3.5" placeholder="Email">
                        <input type="text" id="r-phone" class="input-field py-3.5" placeholder="Số điện thoại">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="password" id="r-pass" required class="input-field tracking-widest py-3.5" placeholder="Mật khẩu">
                        <input type="password" id="r-repass" required class="input-field tracking-widest py-3.5" placeholder="Xác nhận">
                    </div>
                    <button type="submit" id="btn-register" class="btn-primary w-full h-[55px] text-[11px] mt-2 !bg-gradient-to-r !from-emerald-500 !to-teal-500 rounded-xl">ĐĂNG KÝ</button>
                </form>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
