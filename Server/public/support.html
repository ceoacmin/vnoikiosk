<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTNS Enterprise | Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-animated min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">
    <div class="absolute top-[20%] left-[50%] w-[800px] h-[800px] bg-sky-600/10 rounded-full blur-[150px] -translate-x-1/2 -translate-y-1/2 float-anim -z-10"></div>
    <div class="w-full max-w-4xl relative z-10">
        <div class="text-center mb-12">
            <h1 class="text-3xl font-black text-white tracking-[0.2em] drop-shadow-lg mb-3">TRUNG TÂM HỖ TRỢ</h1>
            <p class="text-slate-400 text-xs tracking-wider uppercase font-bold">Cổng thông tin & Tải phần mềm Kiosk Client</p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="glass-panel p-10 rounded-[2rem] text-center border-t border-sky-500/30 shadow-2xl hover:-translate-y-2 transition-transform duration-300">
                <div class="w-20 h-20 rounded-3xl bg-sky-500/10 flex items-center justify-center mx-auto mb-6 shadow-inner border border-sky-500/20">
                    <svg class="w-10 h-10 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                </div>
                <h2 class="text-lg font-black text-white mb-3 tracking-widest uppercase">VNOI KIOSK CLIENT</h2>
                <p class="text-slate-400 text-xs mb-8 leading-relaxed max-w-xs mx-auto">Mã nguồn gốc và gói tải xuống chính thức từ kho lưu trữ GitHub.</p>
                <a href="https://github.com/ceoacmin/vnoikiosk" target="_blank" class="btn-primary w-full h-[55px] text-[11px] tracking-[0.15em] shadow-[0_10px_30px_rgba(56,189,248,0.3)] rounded-xl uppercase">CHUYỂN ĐẾN GITHUB</a>
            </div>
            <div class="glass-panel p-10 rounded-[2rem] text-center border-t border-emerald-500/30 shadow-2xl hover:-translate-y-2 transition-transform duration-300">
                <div class="w-20 h-20 rounded-3xl bg-emerald-500/10 flex items-center justify-center mx-auto mb-6 shadow-inner border border-emerald-500/20">
                    <svg class="w-10 h-10 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </div>
                <h2 class="text-lg font-black text-white mb-3 tracking-widest uppercase">HỖ TRỢ KỸ THUẬT</h2>
                <p class="text-slate-400 text-xs mb-8 leading-relaxed max-w-xs mx-auto">Liên hệ ngay nếu bạn gặp sự cố khi kích hoạt License Key VIP.</p>
                <div class="space-y-4 text-left bg-black/40 p-5 rounded-xl border border-[#334155]">
                    <div class="flex items-center gap-4 text-sky-400 text-[11px] font-bold">
                        <div class="w-8 h-8 rounded-lg bg-sky-500/10 flex items-center justify-center text-sm">📧</div>
                        ceoacmin@gmail.com
                    </div>
                    <div class="flex items-center gap-4 text-indigo-400 text-[11px] font-bold">
                        <div class="w-8 h-8 rounded-lg bg-indigo-500/10 flex items-center justify-center text-[8px] uppercase font-black">DIS</div>
                        ceoacmin.dev
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-10 text-center">
            <button onclick="window.history.back()" class="px-8 py-3 rounded-full border border-[#334155] text-slate-500 font-bold text-[10px] hover:text-white uppercase transition-all tracking-widest bg-[#0f172a]/80 hover:bg-white/5">← QUAY LẠI TRANG CHỦ</button>
        </div>
    </div>
</body>
</html>
